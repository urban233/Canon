[project]
name = "canon"
version = "0.0.1"
description = "A Claude Code plugin that keeps agentic development on track without a stored state machine."
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }

[tool.ruff]
target-version = "py313"
line-length = 88

# Hooks run on the user's own python3, not a resolved Bazel toolchain, so
# they are held to a 3.9 floor: 3.10+ syntax there fails lint rather than
# failing silently on an older machine. See docs/plan.md.
[tool.ruff.per-file-target-version]
"plugins/*/hooks/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["plugins", "tests", "src"]
# server.py is canon-mcp's one file that imports the third-party `mcp`
# SDK -- resolved by `uvx` at runtime (see MODULE.bazel), not by any
# Bazel-managed hub this typecheck run has visibility into. Same
# reasoning and precedent as excluding tools/run_ruff.py/run_pyrefly.py.
project-excludes = [
    "**/__pycache__",
    "**/*.pyc",
    "src/canon_mcp/canon_mcp/server.py",
]
# 3.9, matching the hooks floor: canon_mcp's pure-logic modules are
# written to the same floor on purpose (see src/canon_mcp/BUILD.bazel),
# even though the package actually runs on 3.13 under uvx, so this one
# repo-wide setting doesn't need a second carve-out.
python-version = "3.9"
preset = "strict"
# Each hook directory is its own import root (matching imports=["."] in its
# BUILD.bazel), so `import _common` resolves the same way under Bazel and
# under a bare `python3 hooks/foo.py` invocation. src/canon_mcp is the
# analogous root for `import canon_mcp...` (its BUILD.bazel's py_library
# sets imports=["."] the same way, one level up from the package itself).
search-path = ["plugins/claude/hooks", "src/canon_mcp"]
# No runtime dependency exists yet (see docs/plan.md's Non-goals), so
# skip interpreter discovery rather than depend on whatever venv happens
# to be active in the invoking shell -- this repo has no venv of its own.
skip-interpreter-query = true
