name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: extractions/setup-just@v4.0.0

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # A single `just ci` instead of one `- run:` step per recipe on
      # purpose: the Justfile's `ci` recipe is the one place that list is
      # allowed to live. A hand-copied enumeration here previously drifted
      # from it silently -- this workflow omitted `sync-check` entirely,
      # so a vendored copy under plugins/*/hooks or plugins/*/vendor
      # (see 033815f, the bug sync-check exists to catch) could drift from
      # its canonical source under src/canon_hooks or src/canon_mcp and
      # still pass CI. Adding a `just ci` step here can't drift from the
      # Justfile because it IS the Justfile's list; the `claude` CLI
      # install above still runs first, which `validate-plugin` (the last
      # recipe `ci` runs) needs.
      - run: just ci

  # The companion style checker runs on the developer's own python3, not on a
  # resolved Bazel toolchain, so it is held to the 3.9 floor the README and
  # pyproject.toml advertise. `just ci` above cannot cover this: Bazel pins a
  # hermetic 3.13, which cannot see a 3.10-only attribute reference. Its own
  # job rather than a step, because it needs a different interpreter than the
  # Bazel job. The command itself stays in the Justfile for the same reason
  # the recipe list does.
  python39-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: extractions/setup-just@v4.0.0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.9"

      # Turns a skipped floor check into a failure. Without it this job
      # would report green on any interpreter, having verified nothing.
      - run: just test-py39
        env:
          CANON_REQUIRE_PY39: "1"
