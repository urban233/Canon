[project]
name = "canon-relay-server"
version = "0.2.0"
description = "Canon relay's shared server: routes a local Claude Code session's permission prompts and questions to its own developer's Slack DM."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = ["slack_bolt>=1.21", "aiohttp>=3.9"]

[project.scripts]
canon-relay-server = "canon_relay.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
