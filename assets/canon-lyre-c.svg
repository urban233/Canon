<svg xmlns="http://www.w3.org/2000/svg" width="540" height="680" viewBox="0 0 540 680" role="img" aria-labelledby="title desc">
  <title id="title">Canon Lyre C</title>
  <desc id="desc">The asymmetric Lyre C mark: a broad left crescent, four vertical strings on the right, curled terminals, and a stepped base.</desc>
  <g color="#101BEC" fill="currentColor">
    <!--
      The curved arm is a shaped ribbon, not a stroked letter C. It narrows from
      the top-left scroll, grows through the outer belly, and returns into the
      lower-right curl exactly as in the approved Lyre C construction.
    -->
    <path d="M239 141C206 173 158 199 112 243C66 288 33 343 27 392C20 458 59 516 121 547C191 582 287 586 377 562C434 547 479 516 498 478C511 452 505 426 486 414C468 402 443 406 430 424C417 443 423 465 442 474C450 478 460 479 467 475C462 500 437 523 402 536C346 558 278 561 221 544C170 529 142 490 142 438C142 370 175 305 217 251C235 228 249 209 257 191C266 172 260 153 247 142Z"/>
    <!-- Upper-left spiral: a tapered visual curl flowing into the broad arm. -->
    <path d="M246 151C258 129 256 104 242 89C227 73 202 74 189 90C175 107 181 130 198 140C214 149 232 143 239 130C245 118 239 106 228 101" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal rail and the rounded, slightly teardrop-shaped right terminal. -->
    <path d="M241 127H455V152H241Z"/>
    <path d="M414 128C408 110 412 88 426 73C442 57 467 58 483 74C499 91 497 117 480 134C466 148 446 152 425 151H407C414 145 418 137 414 128Z"/>
    <!-- Four equal, upright strings in the right half of the mark. -->
    <path d="M270 151H281V544H270ZM307 151H318V544H307ZM344 151H355V544H344ZM381 151H392V537H381Z"/>
    <!-- Two-step plinth. -->
    <path d="M187 594H374V619H187ZM161 630H399V664H161Z"/>
  </g>
</svg>
